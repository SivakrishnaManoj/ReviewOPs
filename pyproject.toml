[project]
name = "reviewops"
version = "0.1.0"
description = "ReviewOPs application and delivery backbone"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic-settings>=2.6,<3",
  "psycopg[binary]>=3.2,<4",
  "uvicorn>=0.32,<1",
]

[dependency-groups]
dev = [
  "boto3>=1.42,<2",
  "httpx>=0.28,<1",
  "pytest>=8.3,<10",
  "ruff>=0.11,<1",
]

[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["integration: requires a real PostgreSQL database"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.hatch.build.targets.wheel]
packages = ["src/reviewops"]
