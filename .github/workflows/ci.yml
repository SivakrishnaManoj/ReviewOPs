name: CI and delivery

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy after publishing (requires ECS_SERVICE_ARN)
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: reviewops-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: reviewops
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: reviewops_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U reviewops -d reviewops_test"
          --health-interval 3s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.13.6
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q
        env:
          TEST_DATABASE_URL: postgresql://reviewops:ci-only-password@localhost:5432/reviewops_test

  infrastructure:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.13.5'
      - run: terraform fmt -check -recursive infra
      - run: terraform -chdir=infra init -backend=false -input=false -lockfile=readonly
      - run: terraform -chdir=infra validate

  container:
    needs: [checks, infrastructure]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Build and test the runtime image
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: |
          docker build --build-arg BUILD_SHA="$COMMIT_SHA" -t "reviewops:$COMMIT_SHA" .
          docker run -d --name reviewops-smoke -p 127.0.0.1:8000:8000 "reviewops:$COMMIT_SHA"
          trap 'docker logs reviewops-smoke; docker rm -f reviewops-smoke' EXIT
          for attempt in $(seq 1 30); do
            if python scripts/smoke.py http://127.0.0.1:8000 --sha "$COMMIT_SHA"; then
              break
            fi
            if [ "$attempt" = 30 ]; then exit 1; fi
            sleep 2
          done
          # Promote the exact tested image rather than rebuilding in the delivery job.
          docker save "reviewops:$COMMIT_SHA" | gzip > image.tar.gz
      - uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/main' && vars.AWS_DELIVERY_ENABLED == 'true'
        with:
          name: image-${{ github.sha }}
          path: image.tar.gz
          retention-days: 1

  delivery:
    needs: [container]
    if: >-
      github.ref == 'refs/heads/main' &&
      github.event_name != 'pull_request' &&
      vars.AWS_DELIVERY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.13.6
      - run: uv sync --frozen
      - uses: actions/download-artifact@v4
        with:
          name: image-${{ github.sha }}
      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: reviewops-${{ github.run_id }}
      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr
      - name: Publish tested image
        id: publish
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          REPOSITORY: ${{ vars.ECR_REPOSITORY }}
          COMMIT_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          test -n "$REPOSITORY"
          docker load -i image.tar.gz
          tag="$COMMIT_SHA-$RUN_ID-$RUN_ATTEMPT"
          target="$REGISTRY/$REPOSITORY:$tag"
          docker tag "reviewops:$COMMIT_SHA" "$target"
          docker push "$target"
          digest=$(aws ecr describe-images --repository-name "$REPOSITORY" --image-ids "imageTag=$tag" --query 'imageDetails[0].imageDigest' --output text)
          echo "image=$REGISTRY/$REPOSITORY@$digest" >> "$GITHUB_OUTPUT"
          echo "Published image: \`$REGISTRY/$REPOSITORY@$digest\`" >> "$GITHUB_STEP_SUMMARY"
      - name: Update service and verify the commit
        if: >-
          vars.ECS_SERVICE_ARN != '' &&
          (github.event_name != 'workflow_dispatch' || inputs.deploy)
        env:
          SERVICE_ARN: ${{ vars.ECS_SERVICE_ARN }}
          IMAGE: ${{ steps.publish.outputs.image }}
          COMMIT_SHA: ${{ github.sha }}
        run: uv run python -m scripts.deploy --service-arn "$SERVICE_ARN" --image "$IMAGE" --sha "$COMMIT_SHA"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deployment-${{ github.run_id }}-${{ github.run_attempt }}
          path: deployment.json
          if-no-files-found: ignore
          retention-days: 7
