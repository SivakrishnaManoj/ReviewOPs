name: Read OIDC identity

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  identity:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Print identity claims only, never the token
        shell: python
        run: |
          import base64
          import json
          import os
          import urllib.parse
          import urllib.request
          url = os.environ['ACTIONS_ID_TOKEN_REQUEST_URL']
          url += ('&' if '?' in url else '?') + urllib.parse.urlencode({'audience': 'sts.amazonaws.com'})
          request = urllib.request.Request(url, headers={
              'Authorization': 'Bearer ' + os.environ['ACTIONS_ID_TOKEN_REQUEST_TOKEN']
          })
          with urllib.request.urlopen(request, timeout=15) as response:
              token = json.load(response)['value']
          segment = token.split('.')[1]
          claims = json.loads(base64.urlsafe_b64decode(segment + '=' * (-len(segment) % 4)))
          print(json.dumps({key: claims[key] for key in ('iss', 'aud', 'sub')}, indent=2))
