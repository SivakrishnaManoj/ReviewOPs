services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: reviewops
      POSTGRES_PASSWORD: local-development-only
      POSTGRES_DB: reviewops
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reviewops -d reviewops"]
      interval: 3s
      timeout: 3s
      retries: 20

  migrate:
    build: .
    command: ["python", "-m", "scripts.migrate"]
    environment:
      DATABASE_URL: postgresql://reviewops:local-development-only@db:5432/reviewops
    depends_on:
      db:
        condition: service_healthy

  api:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      DATABASE_URL: postgresql://reviewops:local-development-only@db:5432/reviewops
      APP_ENV: local
    depends_on:
      migrate:
        condition: service_completed_successfully
    volumes:
      - ./src:/app/src:ro

volumes:
  postgres-data:
